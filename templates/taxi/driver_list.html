{% extends "base.html" %}
{% block title %}
    <title>Taxi - Driver</title>
{% endblock %}

{% block content %}
<h1>Drivers List</h1>
    {% if driver_list %}
<ul>
    {% for driver in driver_list %}
    <li><a href="{% url 'taxi:driver-detail' driver.id %}">{{driver.username}}</a></li>
    {% endfor %}
</ul>
    {% endif %}
{% endblock %}
