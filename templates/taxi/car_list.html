{% extends "base.html" %}
{% block title %}
    <title>Taxi - Car</title>
{% endblock %}

{% block content %}
<h1>Cars List</h1>
    {% if car_list %}
<ul>
    {% for car in car_list %}
    <li><a href="{% url 'taxi:car-detail' car.id %}">{{car.id}}</a></li>
    {% endfor %}
</ul>
    {% endif %}
{% endblock %}
